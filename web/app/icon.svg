<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Browser-tab icon: the AI mascot's face (see components/ai-mascot.tsx),
       simplified so it stays legible at 16px. Same palette as the OG image. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <!-- antenna -->
  <line x1="32" y1="12" x2="32" y2="17" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="9" r="3.5" fill="#22d3ee"/>
  <!-- face screen -->
  <rect x="12" y="18" width="40" height="32" rx="13" fill="#0b1020"/>
  <!-- eyes -->
  <rect x="21" y="27" width="6" height="10" rx="3" fill="#f8fafc"/>
  <rect x="37" y="27" width="6" height="10" rx="3" fill="#f8fafc"/>
  <circle cx="25.5" cy="29.5" r="1.2" fill="#22d3ee"/>
  <circle cx="41.5" cy="29.5" r="1.2" fill="#22d3ee"/>
  <!-- cheeks -->
  <circle cx="18.5" cy="40" r="2.6" fill="#fb7185" opacity="0.55"/>
  <circle cx="45.5" cy="40" r="2.6" fill="#fb7185" opacity="0.55"/>
  <!-- smile -->
  <path d="M26 41.5 q6 4.5 12 0" fill="none" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round"/>
</svg>
