name: Keep warm

# Render's free tier spins the API down after ~15 min idle (first request then
# takes ~60s) and Neon suspends its compute after ~5 min idle (first query then
# takes several seconds). Hit /db/health — not /health — so one ping wakes both.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://agentic-rag-ai-fspt.onrender.com/db/health || true
