name: Keep warm

# Render's free tier spins the API down after ~15 min idle (first request then
# takes ~60s). Ping /health — deliberately NOT /db/health — so only the dyno is
# kept awake: Neon's free tier is metered in compute-hours per month, and a DB
# that never auto-suspends can burn the whole quota mid-month (DB then stops
# entirely, far worse than a ~2s wake). Neon's wake is hidden by the frontend
# instead: the landing page fires /db/health on load (web/components/warm-up.tsx),
# so the DB is up by the time a visitor reaches /chat. The process itself
# pre-warms its graph/DB pool/embedding client at boot (ai/app/main.py).
#
# Caveat: GitHub schedules are best-effort and routinely drift 10-30 min under
# load, so this alone lets the dyno fall asleep between pings. */5 is the
# floor GitHub allows; the primary pinger is an on-time external cron
# (cron-job.org, every 5 min, same URL) — this workflow is the backup.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://agentic-rag-ai-hosn.onrender.com/health || true
